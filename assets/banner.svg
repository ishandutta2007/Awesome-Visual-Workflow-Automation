<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1f2937; stroke-opacity: 0.4; stroke-width: 1; }
    .flow-line { stroke-dasharray: 8 12; animation: flowDash 30s linear infinite; }
    .pulse-node { animation: pulse 4s ease-in-out infinite alternate; }
    .pulse-delay-1 { animation: pulse 4s ease-in-out infinite alternate; animation-delay: 1.3s; }
    .pulse-delay-2 { animation: pulse 4s ease-in-out infinite alternate; animation-delay: 2.6s; }
    .float-badge { animation: floatSlow 6s ease-in-out infinite alternate; }
    .float-badge-2 { animation: floatSlow 6s ease-in-out infinite alternate; animation-delay: 3s; }
    .signal-dot { animation: travel 5s linear infinite; }
    .signal-dot-2 { animation: travel2 6s linear infinite; animation-delay: 1.5s; }

    @keyframes flowDash {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes travel {
      0% { cx: 80; cy: 180; opacity: 0; }
      10% { opacity: 1; }
      45% { cx: 280; cy: 290; }
      80% { cx: 920; cy: 290; opacity: 1; }
      100% { cx: 1120; cy: 180; opacity: 0; }
    }
    @keyframes travel2 {
      0% { cx: 80; cy: 180; opacity: 0; }
      10% { opacity: 1; }
      50% { cx: 600; cy: 65; }
      85% { cx: 1120; cy: 180; opacity: 1; }
      100% { cx: 1120; cy: 180; opacity: 0; }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Geometric Grid Canvas Background -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="180" r="140" fill="#3b82f6" opacity="0.12" filter="url(#glow-soft)" />
  <circle cx="1000" cy="180" r="140" fill="#8b5cf6" opacity="0.12" filter="url(#glow-soft)" />
  <circle cx="600" cy="70" r="100" fill="#10b981" opacity="0.08" filter="url(#glow-soft)" />

  <!-- Animated Curved Workflow Connecting Lines -->
  <g fill="none">
    <path d="M 80,180 C 180,180 180,290 280,290 L 920,290 C 1020,290 1020,180 1120,180" 
          stroke="url(#grad-blue)" stroke-width="2.5" stroke-opacity="0.6" class="flow-line" />
    <path d="M 80,180 C 200,180 350,65 600,65 C 850,65 1000,180 1120,180" 
          stroke="url(#grad-purple)" stroke-width="2.5" stroke-opacity="0.6" class="flow-line" />
    <path d="M 280,290 C 400,290 480,210 600,210 C 720,210 800,290 920,290" 
          stroke="url(#grad-emerald)" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="6 8" />
  </g>

  <!-- Flowing Signal Dots -->
  <circle class="signal-dot" r="4.5" fill="#60a5fa" filter="url(#glow)" />
  <circle class="signal-dot-2" r="4" fill="#c084fc" filter="url(#glow)" />

  <!-- Edge Nodes & Visual Connectors (Background Decorative) -->
  <!-- Left Source Trigger Node -->
  <g transform="translate(50, 150)">
    <rect width="60" height="60" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <path d="M 24,18 L 38,30 L 24,42 Z" fill="#38bdf8" />
  </g>

  <!-- Right Target Action Node -->
  <g transform="translate(1090, 150)">
    <rect width="60" height="60" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
    <circle cx="30" cy="30" r="12" stroke="#c084fc" stroke-width="2.5" />
    <path d="M 24,30 L 28,34 L 37,25" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Top Center Router Node -->
  <g transform="translate(570, 40)">
    <rect width="60" height="50" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#glow)" />
    <circle cx="20" cy="25" r="4" fill="#34d399" />
    <circle cx="40" cy="18" r="4" fill="#38bdf8" />
    <circle cx="40" cy="32" r="4" fill="#c084fc" />
    <path d="M 24,25 L 36,18 M 24,25 L 36,32" stroke="#64748b" stroke-width="1.5" />
  </g>

  <!-- Floating Feature Pills / Badges in Corners -->
  <g class="float-badge" transform="translate(160, 55)">
    <rect width="130" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="19" class="badge-text">⚡ Triggers &amp; APIs</text>
  </g>

  <g class="float-badge-2" transform="translate(910, 55)">
    <rect width="140" height="30" rx="15" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="5" fill="#c084fc" />
    <text x="30" y="19" class="badge-text">🤖 AI Agents &amp; Flows</text>
  </g>

  <g class="float-badge" transform="translate(190, 275)">
    <rect width="160" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="5" fill="#34d399" />
    <text x="30" y="19" class="badge-text">🔄 Low-Code Canvas</text>
  </g>

  <g class="float-badge-2" transform="translate(850, 275)">
    <rect width="160" height="30" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="5" fill="#fbbf24" />
    <text x="30" y="19" class="badge-text">🌐 Cloud &amp; Self-Hosted</text>
  </g>

  <!-- FOREGROUND: Main Title & Subtitle Card (Solid Backdrop to Prevent Any Visual Overlap) -->
  <g transform="translate(600, 165)">
    <!-- Protective soft background badge -->
    <rect x="-380" y="-55" width="760" height="110" rx="20" fill="#0b0f19" fill-opacity="0.82" stroke="#334155" stroke-width="1" />
    
    <!-- Title Line -->
    <text x="0" y="-8" text-anchor="middle" font-size="35" class="title-text">
      Awesome Visual Workflow Automation
    </text>
    
    <!-- Subtitle Line -->
    <text x="0" y="28" text-anchor="middle" font-size="14.5" class="subtitle-text">
      Curated Directory of Visual No-Code/Low-Code iPaaS &amp; Self-Hosted Flow Engines
    </text>
  </g>

</svg>
